spring:
  application:
    name: zhuque
  datasource:
    url: jdbc:postgresql://localhost:5432/zhuque
    username: zhuque
    password: zhuque
  flyway:
    enabled: true
    locations: classpath:db/migration

# 本机 8080 通常由 Higress 网关占用，控制面默认使用独立端口。
server:
  port: ${SERVER_PORT:8081}

zhuque:
  # M8 发布目标。凭据走环境变量，不写进代码库。
  higress:
    console-url: ${HIGRESS_CONSOLE_URL:http://localhost:8001}
    username: ${HIGRESS_USERNAME:}
    password: ${HIGRESS_PASSWORD:}
    # 最低版本要求，DeployPrecheck 用 GET /system/info 校验
    min-version: "2.2.0"
    # 无法从 Console 安全探测的部署前置条件必须由运维显式确认；默认 false 会阻止发布。
    redis-ready: ${ZHUQUE_HIGRESS_REDIS_READY:false}
    mcp-enabled: ${ZHUQUE_HIGRESS_MCP_ENABLED:false}
  nacos:
    server-url: ${NACOS_SERVER_URL:http://localhost:8848}
    namespace: ${NACOS_NAMESPACE:public}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    min-version: "3.0.1"

  # M9 漂移检测的默认扫描间隔（可配）
  drift:
    spec-scan-interval: PT6H
    config-scan-interval: PT6H
  testing:
    # 正式 L1 只允许向这里显式列出的 test/staging origin 出网（逗号分隔）。
    # 默认空值等于 deny-all，避免 env_profile 被误标为 test 后访问生产或内网。
    # 例：https://staging-api.example.com,http://localhost:19080
    allowed-origins: ${ZHUQUE_TESTING_ALLOWED_ORIGINS:}
  # M10 Key 轮换后旧 key 的保留重叠窗口
  key:
    rotation-overlap: 24h
  # M3 匹配：池子超过该阈值才需要检索预筛（v1 不实现，只留扩展点）
  matching:
    prefilter-threshold: 2000
