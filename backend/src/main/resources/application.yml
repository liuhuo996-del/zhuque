spring:
  application:
    name: gateforge
  datasource:
    url: jdbc:postgresql://localhost:5432/zhuque
    username: zhuque
    password: zhuque
  flyway:
    enabled: true
    locations: classpath:db/migration

# 本机 8080 通常由 Higress 网关占用，控制面默认使用独立端口。
server:
  port: ${SERVER_PORT:8081}

zhuque:
  # Higress Nacos3 MCP Bridge 对外路径：{base}/{mcp-server-name}/sse
  mcp-public-base-url: ${ZHUQUE_MCP_PUBLIC_BASE_URL:http://localhost:8080/mcp}
  # M8 唯一发布目标。Higress 的 Nacos3 source、路由和鉴权由运行平台维护。
  nacos:
    server-url: ${NACOS_SERVER_URL:http://localhost:8848}
    namespace: ${NACOS_NAMESPACE:public}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    min-version: "3.0.1"
    # Nacos AI Registry 写入后 detail 是最终一致的；发布与回滚共用该有界窗口。
    mcp-visible-timeout: ${ZHUQUE_NACOS_MCP_VISIBLE_TIMEOUT:PT30S}
    mcp-poll-interval: ${ZHUQUE_NACOS_MCP_POLL_INTERVAL:PT0.25S}
    mcp-delete-settle-window: ${ZHUQUE_NACOS_MCP_DELETE_SETTLE_WINDOW:PT2S}

  # M9 漂移检测的默认扫描间隔（可配）
  drift:
    spec-scan-interval: PT6H
    config-scan-interval: PT6H
  testing:
    # 正式 L1 只允许向这里显式列出的 test/staging origin 出网（逗号分隔）。
    # 默认空值等于 deny-all，避免 env_profile 被误标为 test 后访问生产或内网。
    # 例：https://staging-api.example.com,http://localhost:19080
    allowed-origins: ${ZHUQUE_TESTING_ALLOWED_ORIGINS:}
  # M10 Key 轮换后旧 key 的保留重叠窗口
  key:
    rotation-overlap: 24h
  # M3 匹配：池子超过该阈值才需要检索预筛（v1 不实现，只留扩展点）
  matching:
    prefilter-threshold: 2000
