name: gateforge

services:
  gateforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: gateforge:0.2.0
    ports:
      - "${GATEFORGE_HTTP_PORT:-8081}:8081"
    environment:
      GATEFORGE_DATABASE_PATH: /data/gateforge.db
      GATEFORGE_STATIC_DIR: /app/static
      GATEFORGE_NACOS_SERVER_URL: "${GATEFORGE_NACOS_SERVER_URL:-http://host.docker.internal:8848}"
      GATEFORGE_NACOS_CONTEXT_PATH: "${GATEFORGE_NACOS_CONTEXT_PATH:-/nacos}"
      GATEFORGE_NACOS_NAMESPACE: "${GATEFORGE_NACOS_NAMESPACE:-public}"
      GATEFORGE_NACOS_USERNAME: "${GATEFORGE_NACOS_USERNAME:-}"
      GATEFORGE_NACOS_PASSWORD: "${GATEFORGE_NACOS_PASSWORD:-}"
      GATEFORGE_ALLOWED_SPEC_HOSTS: "${GATEFORGE_ALLOWED_SPEC_HOSTS:-}"
      GATEFORGE_ALLOW_PRIVATE_SPEC_HOSTS: "${GATEFORGE_ALLOW_PRIVATE_SPEC_HOSTS:-false}"
      GATEFORGE_AI_BASE_URL: "${GATEFORGE_AI_BASE_URL:-}"
      GATEFORGE_AI_API_KEY: "${GATEFORGE_AI_API_KEY:-}"
      GATEFORGE_AI_MODEL: "${GATEFORGE_AI_MODEL:-}"
      GATEFORGE_L1_ALLOW_ORIGINS: "${GATEFORGE_L1_ALLOW_ORIGINS:-}"
      GATEFORGE_L1_ALLOW_UNSAFE_METHODS: "${GATEFORGE_L1_ALLOW_UNSAFE_METHODS:-false}"
      GATEFORGE_QUALITY_THRESHOLD: "${GATEFORGE_QUALITY_THRESHOLD:-0.78}"
    volumes:
      - gateforge-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  gateforge-data:
